[project]
name = "lambda-runtimes"
version = "0.1.0"
description = "AWS Lambda runtime inventory tool for multiple AWS accounts and regions"
requires-python = ">=3.11"

dependencies = [
    "boto3>=1.34.0",
    "tzdata"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pre-commit>=3.7.0"
]

lint = [
    "ruff>=0.5.0"
]


[project.scripts]
lambda-runtimes = "lambda_runtimes.main:main"


[tool.hatch.build.targets.wheel]
packages = [
    "src/lambda_runtimes"
]


[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist"
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]


[tool.pytest.ini_options]
testpaths = [
    "tests"
]


[build-system]
requires = [
    "hatchling"
]
build-backend = "hatchling.build"
