[project]
name = "lambda-runtimes"
version = "0.1.0"
description = "AWS Lambda runtime inventory tool for multiple AWS accounts and regions"
requires-python = ">=3.11"

dependencies = [
    "boto3>=1.34.0",
    "tzdata"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pre-commit>=3.7.0",
    "ruff>=0.5.0"
]

lint = [
    "ruff>=0.5.0"
]

[project.scripts]
lambda-runtimes = "lambda_runtimes.main:main"


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear checks
    "UP"    # python upgrade suggestions
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

[build-system]
requires = [
    "hatchling"
]
build-backend = "hatchling.build"
