name: Ruff Auto Fix

on:
  workflow_dispatch:


permissions:
  contents: write
  pull-requests: write


jobs:
  ruff-fix:
    name: Create Ruff Fix PR
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          uv sync --group lint

      - name: Apply Ruff fixes
        run: |
          uv run ruff format .
          uv run ruff check --fix .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/ruff-fixes
          base: main
          title: "chore: apply Ruff fixes"
          commit-message: "chore: apply automated Ruff fixes"
          body: |
            ## Automated Ruff Cleanup

            This PR was generated by GitHub Actions.

            Applied:
            - Ruff formatting
            - Automatic Ruff lint fixes
