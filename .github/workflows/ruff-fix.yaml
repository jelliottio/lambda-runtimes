name: Ruff Auto Fix

on:
  push:
    branches:
      - "**"

  workflow_dispatch:


permissions:
  contents: write
  pull-requests: write


jobs:
  ruff-fix:
    name: Create Ruff Fix PR
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          uv sync --only-group lint --no-install-project

      - name: Apply Ruff fixes
        run: |
          uv run ruff format .
          uv run ruff check --fix .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/ruff-fixes
          base: main
          title: "chore: apply Ruff fixes"
          commit-message: "chore: apply Ruff automated fixes"
          body: |
            ## Automated Ruff Cleanup

            This PR was generated by GitHub Actions.

            Applied:
            - Ruff formatting
            - Ruff automatic lint fixes
